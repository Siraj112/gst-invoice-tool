  <script>
    function calculateGST() {
      const client = document.getElementById('client-name').value;
      const item = document.getElementById('item-desc').value;
      const amount = parseFloat(document.getElementById('item-amount').value);

      if(!client || !item || !amount) {
        alert("Kripya saari details bharein!");
        return;
      }

      const cgst = (amount * 9) / 100;
      const sgst = (amount * 9) / 100;
      const total = amount + cgst + sgst;
      const today = new Date().toLocaleDateString('en-IN');

      document.getElementById('res-client').innerText = client;
      document.getElementById('res-item').innerText = item;
      document.getElementById('res-amount').innerText = amount.toFixed(2);
      document.getElementById('res-cgst').innerText = cgst.toFixed(2);
      document.getElementById('res-sgst').innerText = sgst.toFixed(2);
      document.getElementById('res-total').innerText = total.toFixed(2);
      document.getElementById('print-date').innerText = today;

      document.getElementById('invoice-box').style.display = 'block';
      document.getElementById('download-btn-container').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function downloadPDF() {
      const btn = document.getElementById('pdf-btn');
      btn.innerText = "Wait, File ban rahi hai... ⏳";
      
      const element = document.getElementById('invoice-box');
      const clientName = document.getElementById('res-client').innerText || 'Client';

      // 1. PDF banane se pehle Invoice ki width ko Desktop size (800px) kar do
      element.style.width = '800px';
      element.style.maxWidth = '800px';
      element.style.margin = '0 auto';

      // 2. PDF Settings
      const opt = {
        margin:       0.5,
        filename:     `Invoice_${clientName}.pdf`,
        image:        { type: 'jpeg', quality: 1 },
        html2canvas:  { scale: 2, useCORS: true, scrollY: 0 },
        jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
      };

      // 3. PDF Generate karo
      html2pdf().set(opt).from(element).save().then(() => {
        // 4. PDF download hone ke baad width wapas mobile size par le aao
        element.style.width = '100%';
        element.style.maxWidth = '100%';
        btn.innerText = "📥 Download PDF";
      }).catch((error) => {
        alert("PDF download nahi ho payi. Kripya wapas try karein.");
        element.style.width = '100%';
        element.style.maxWidth = '100%';
        btn.innerText = "📥 Download PDF";
      });
    }
  </script>
</body>
</html>
